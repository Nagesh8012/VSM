{% extends 'admin/adminbase.html' %}
{% load static %}
{% block content %}

<style>
  a:link, a:hover {
    text-decoration: none;
  }

  .card-page-wrap {
    padding: 95px 24px 32px 124px;
  }

  .card-page-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(190px, 1fr));
    gap: 24px;
  }

  .menu-card {
    min-height: 168px;
    border: 0;
    border-radius: 10px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 18px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
    transition: transform .2s ease, box-shadow .2s ease;
  }

  .menu-card:hover {
    color: #fff;
    transform: translateY(-4px);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
  }

  .menu-card i {
    color: #fff;
    font-size: 22px;
    margin-bottom: 18px;
  }

  .menu-card h3 {
    color: #fff;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .menu-card p {
    color: rgba(255, 255, 255, .92);
    font-size: 13px;
    line-height: 1.4;
    margin: 0;
  }

  .card-purple { background: #4834d4; }
  .card-orange { background: #f0932b; }
  .card-green { background: #6ab04c; }
  .card-red { background: #eb4d4b; }
  .card-blue { background: #4099ff; }

  @media only screen and (max-width: 1200px) {
    .card-page-grid {
      grid-template-columns: repeat(2, minmax(220px, 1fr));
    }
  }

  @media only screen and (max-width: 600px) {
    .card-page-wrap {
      padding: 90px 16px 24px 16px;
    }

    .card-page-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="card-page-wrap">
  <div class="card-page-grid">
      <a class="menu-card card-purple" href="/admin-view-customer">
        <div>
          <i class="fas fa-eye"></i>
          <h3>View Customers</h3>
          <p>See all customers</p>
        </div>
      </a>      <a class="menu-card card-orange" href="/admin-add-customer">
        <div>
          <i class="fas fa-plus-circle"></i>
          <h3>Add Customer</h3>
          <p>Create customer account</p>
        </div>
      </a>      <a class="menu-card card-green" href="/admin-view-customer-enquiry">
        <div>
          <i class="fas fa-question-circle"></i>
          <h3>Customer Enquiry</h3>
          <p>Review customer enquiries</p>
        </div>
      </a>      <a class="menu-card card-red" href="/admin-view-customer-invoice">
        <div>
          <i class="fas fa-rupee-sign"></i>
          <h3>Customer Invoice</h3>
          <p>View customer invoices</p>
        </div>
      </a>  </div>
</div>

{% endblock content %}
